name: Reputation Platform CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: reputation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: python-web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
          python-version: '3.12.4'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.17.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: apps/web/package.json
      - run: uv sync --locked --all-packages
      - name: Core scoring boundary case
        run: uv run --locked --all-packages python -m unittest discover -s tests -p test_scoring.py -v
      - name: Shared rules and MangoSwap single-score source boundaries
        run: |
          uv run --locked --all-packages python -m unittest discover -s tests -p test_shared_scoring.py -v
          uv run --locked --all-packages python -m unittest discover -s tests -p test_single_score_report.py -v
      - name: Public report selection and frozen dependency bytes
        run: uv run --locked --all-packages python -m unittest discover -s tests -p test_public_reports.py -v
      - name: Shared unsigned swap protocol boundaries
        run: uv run --locked --all-packages python -m unittest discover -s tests -p test_unsigned_swap_protocol.py -v
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web run build

  postgres:
    name: postgres-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: reputation_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d reputation_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      REPUTATION_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/reputation_ci
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.3'
          python-version: '3.12.4'
      - run: uv sync --locked --all-packages
      - name: Transaction Agent publications, public-off worker and concurrent PostgreSQL leases
        run: uv run --locked --all-packages python scripts/check_release_smoke.py
