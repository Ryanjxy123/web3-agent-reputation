[project]
name = "web3-agent-reputation-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/verifier", "services/platform", "fixtures/agents"]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<0.15",
  "mypy>=1.18,<2",
  "jsonschema>=4.25,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "postgres: requires a real PostgreSQL instance",
  "chain: requires a real local Anvil instance",
  "e2e: real API, worker, PostgreSQL and Anvil",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
