[project]
name = "reputation-verifier"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["reputation-core", "web3>=7.14,<8", "jsonschema>=4.25,<5"]

[project.scripts]
reputation-verify = "reputation_verifier.cli:main"
reputation-verifier = "reputation_verifier.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.uv.sources]
reputation-core = { workspace = true }
