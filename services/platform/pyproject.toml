[project]
name = "reputation-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["reputation-core", "httpx==0.28.1", "httpcore==1.0.9", "fastapi==0.143.3", "uvicorn==0.54.0", "psycopg[binary]==3.3.6"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reputation_platform"]
