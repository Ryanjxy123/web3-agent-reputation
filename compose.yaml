name: web3-agent-reputation
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: reputation
      POSTGRES_USER: reputation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_local.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reputation -d reputation"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    image: reputation-platform:local
    command: ["reputation", "migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://reputation:${POSTGRES_PASSWORD}@postgres:5432/reputation
    networks: [control]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: reputation-platform:local
    pull_policy: never
    environment:
      DATABASE_URL: postgresql+psycopg://reputation:${POSTGRES_PASSWORD}@postgres:5432/reputation
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?Run scripts/init_local.py first}
      PUBLIC_ACCESS_ENABLED: "false"
      LOCAL_CHAIN_CONFIG: /app/runtime/local-chain/deployment.json
      EVIDENCE_ROOT: /app/artifacts/evidence
    volumes:
      - ${COMPOSE_RUNTIME_DIR:-./runtime/compose-chain}/deployment.json:/app/runtime/local-chain/deployment.json:ro
      - evidence-data:/app/artifacts/evidence
    ports: ["127.0.0.1:8000:8000"]
    networks: [control, ingress]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    image: reputation-platform:local
    pull_policy: never
    command: ["reputation", "worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://reputation:${POSTGRES_PASSWORD}@postgres:5432/reputation
      PUBLIC_ACCESS_ENABLED: "false"
      LOCAL_CHAIN_CONFIG: /app/runtime/local-chain/deployment.json
      PUBLISHER_SECRET_PATH: /app/runtime/local-chain/publisher-secret.json
      EVIDENCE_ROOT: /app/artifacts/evidence
      CODE_VERSION: ${CODE_VERSION:?Set CODE_VERSION to the exact source commit before building}
    volumes:
      - evidence-data:/app/artifacts/evidence
      - ${COMPOSE_RUNTIME_DIR:-./runtime/compose-chain}/deployment.json:/app/runtime/local-chain/deployment.json:ro
      - ${COMPOSE_RUNTIME_DIR:-./runtime/compose-chain}/publisher-secret.json:/app/runtime/local-chain/publisher-secret.json:ro
    networks: [control, demo]
    depends_on:
      migrate:
        condition: service_completed_successfully
      fixture-a:
        condition: service_healthy
      fixture-d:
        condition: service_healthy

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.4@sha256:f69e1b8d1dda17d89227a4d0513b1d86f93ece430dea8d87aaea643da3607d3e
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--silent"]
    ports: ["127.0.0.1:8545:8545"]
    networks: [demo, ingress]
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: reputation-web:local
    environment:
      PLATFORM_API_ORIGIN: http://api:8000
    ports: ["127.0.0.1:5173:5173"]
    networks: [control, ingress]
    depends_on:
      api:
        condition: service_healthy

  fixture-a:
    image: reputation-platform:local
    pull_policy: never
    command: ["uvicorn", "fixture_agents.service:create_app", "--factory", "--host", "0.0.0.0", "--port", "9101", "--no-access-log"]
    environment:
      FIXTURE_CONFIG: /app/runtime/local-chain/fixture-a.json
      FIXTURE_LEDGER_PATH: /app/artifacts/fixtures/tasks.sqlite3
    volumes:
      - ${COMPOSE_RUNTIME_DIR:-./runtime/compose-chain}/fixture-a.json:/app/runtime/local-chain/fixture-a.json:ro
      - fixture-a-data:/app/artifacts/fixtures
    networks: [demo]
    depends_on:
      anvil:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  fixture-d:
    image: reputation-platform:local
    pull_policy: never
    command: ["uvicorn", "fixture_agents.service:create_app", "--factory", "--host", "0.0.0.0", "--port", "9102", "--no-access-log"]
    environment:
      FIXTURE_CONFIG: /app/runtime/local-chain/fixture-d.json
      FIXTURE_LEDGER_PATH: /app/artifacts/fixtures/tasks.sqlite3
    volumes:
      - ${COMPOSE_RUNTIME_DIR:-./runtime/compose-chain}/fixture-d.json:/app/runtime/local-chain/fixture-d.json:ro
      - fixture-d-data:/app/artifacts/fixtures
    networks: [demo]
    depends_on:
      anvil:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  ingress:
    driver: bridge
  control:
    internal: true
  demo:
    internal: true
volumes:
  postgres-data:
  evidence-data:
  fixture-a-data:
  fixture-d-data:
